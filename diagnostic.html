<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Diagnostic de la base – Biljap Soft</title>
<script src="assets/supabase-config.js?v=2"></script>
<style>
body{font:17px/1.6 system-ui,sans-serif;max-width:640px;margin:0 auto;padding:20px;color:#051C24;background:#fff}
h1{font-size:1.6rem} label{display:block;margin:14px 0 4px;font-weight:700}
input{width:100%;padding:12px;font-size:1rem;border:2px solid #cfe0e8;border-radius:10px}
button{margin-top:14px;padding:12px 18px;border:0;border-radius:10px;background:#0594D0;color:#fff;font-weight:700;font-size:1rem}
pre{white-space:pre-wrap;word-break:break-word;background:#f0f7fa;border:2px solid #cfe0e8;border-radius:10px;padding:12px;font-size:.9rem;min-height:2.5em}
</style>
</head>
<body>
<h1>Diagnostic de la base</h1>
<p>Page temporaire, à supprimer du dépôt quand tout fonctionne.</p>
<h2>Réglages lus dans supabase-config.js</h2>
<pre id="conf"></pre>
<h2>1. Tester la connexion</h2>
<button id="b1" type="button">Lancer le test</button>
<pre id="o1"></pre>
<h2>2. Tester l’inscription</h2>
<label for="e">E-mail</label><input id="e" type="email" value="contact1bjp@gmail.com">
<label for="p">Mot de passe (8 caractères minimum)</label><input id="p" type="password">
<button id="b2" type="button">Lancer le test</button>
<pre id="o2"></pre>
<script>
(function () {
  var c = window.BILJAP_DB || {}, u = c.url || '', k = c.key || '';
  var avis = [];
  if (!u || u.indexOf('VOTRE') !== -1) avis.push('ERREUR : l’adresse du projet n’est pas remplie.');
  if (u && !/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(u)) avis.push('ATTENTION : l’adresse doit ressembler à https://xxxx.supabase.co, sans « / » à la fin ni « /rest/v1 ».');
  if (!k || k.indexOf('VOTRE') !== -1) avis.push('ERREUR : la clé publique n’est pas remplie.');
  if (/^sb_secret_|service_role/i.test(k)) avis.push('DANGER : ceci est une clé secrète. Retirez-la du site et utilisez la clé publique.');
  document.getElementById('conf').textContent = 'Adresse : ' + u + '\nClé : ' + k.slice(0, 14) + '… (' + k.length + ' caractères)' + (avis.length ? '\n\n' + avis.join('\n') : '\n\nFormat correct.');
  function montrer(id, r) { return r.text().then(function (t) { document.getElementById(id).textContent = 'Code HTTP : ' + r.status + '\n' + t; }); }
  function echec(id, e) { document.getElementById(id).textContent = 'Échec réseau : ' + e.message + '\n(adresse du projet incorrecte, ou pas de connexion)'; }
  document.getElementById('b1').onclick = function () {
    document.getElementById('o1').textContent = 'Test en cours…';
    fetch(u + '/auth/v1/settings', { headers: { apikey: k } }).then(function (r) { return montrer('o1', r); }).catch(function (e) { echec('o1', e); });
  };
  document.getElementById('b2').onclick = function () {
    document.getElementById('o2').textContent = 'Test en cours…';
    fetch(u + '/auth/v1/signup', { method: 'POST', headers: { apikey: k, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('e').value.trim(), password: document.getElementById('p').value }) })
      .then(function (r) { return montrer('o2', r); }).catch(function (e) { echec('o2', e); });
  };
})();
</script>
</body>
</html>
